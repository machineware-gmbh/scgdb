name: style

on:
  push:
    branches:
      - 'main'
      - 'dev**'

jobs:
  style:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup Python
        uses: actions/setup-python@v7

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python style
        run: ruff check --output-format=github .

      - name: Check C++ style
        run: ./test/format.py -n
